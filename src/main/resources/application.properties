# =============================================
# Application
# =============================================
spring.application.name=quiz-share

# =============================================
# DataSource - MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_share?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=zyyx3678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# Mail - Gmail SMTP
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================
# Server
# =============================================
server.port=8080
server.servlet.context-path=/
# Lắng nghe trên tất cả network interfaces (cho phép mobile kết nối qua LAN/WiFi)
server.address=0.0.0.0

# =============================================
# JWT
# =============================================
app.jwt.secret=your_jwt_secret_key_must_be_at_least_256_bits_long_for_hs256_algorithm
# 7 days in milliseconds
app.jwt.expiration=604800000

# =============================================
# File Storage (type: gcs | local)
# =============================================
app.storage.type=local

# Google Cloud Storage
app.storage.gcs.bucket-name=your-gcs-bucket-name
app.storage.gcs.project-id=your-gcs-project-id
app.storage.gcs.credentials-path=/path/to/service-account.json

# Local Storage
app.storage.local.upload-dir=uploads/
app.storage.local.base-url=http://localhost:8080/files/

# =============================================
# Mail From
# =============================================
app.mail.from=noreply@quizshare.com

# =============================================
# Logging
# =============================================
logging.level.com.quizshare=DEBUG
logging.level.org.springframework.security=INFO
